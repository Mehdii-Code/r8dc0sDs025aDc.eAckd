<script>
let ws;
let username = null;

function connectToServer() {
    const ip = document.getElementById("serverIP").value || "127.0.0.1";
    const port = document.getElementById("serverPort").value || 8765;
    ws = new WebSocket(`ws://${ip}:${port}`);

    ws.onopen = () => {
        updateStatus(true);
        closeServerModal();
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        displayMessage(msg);
    };

    ws.onclose = () => updateStatus(false);
    ws.onerror = () => updateStatus(false);
}

function sendMessage() {
    if (!username) {
        showUsernameModal();
        return;
    }
    const input = document.getElementById("messageInput");
    const content = input.value.trim();
    if (content && ws && ws.readyState === WebSocket.OPEN) {
        const msg = {
            username: username,
            content: content,
            timestamp: new Date().toISOString().replace("T", " ").split(".")[0]
        };
        ws.send(JSON.stringify(msg));
        input.value = "";
        displayMessage(msg);
    }
}

function displayMessage(msg) {
    const container = document.getElementById("messages");
    if (!container) return;

    const div = document.createElement("div");
    div.className = "message";

    const header = document.createElement("div");
    header.className = "message-header";

    const user = document.createElement("span");
    user.className = "message-username";
    user.textContent = msg.username;

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = msg.timestamp;

    header.appendChild(user);
    header.appendChild(time);

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = msg.content;

    div.appendChild(header);
    div.appendChild(content);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}
</script>
